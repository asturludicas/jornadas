<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscripciones AsturLúdicas</title>
<style>
  :root{--ink:#111;--paper:#EFE0C3;--surface:#fffaf1;--accent:#e8894a;--green:#176345;--green-l:#e0f9f1;--amber:#765000;--amber-l:#fff6d6;--red:#a12630;--red-l:#ffe3e4;--gris:#625d54}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:transparent;color:var(--ink);padding:8px}
  .caja{background:var(--surface);border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:16px;max-width:520px}
  h2{font-size:17px;margin:16px 0 8px}
  .acceso{text-align:center}
  .boton{display:block;width:100%;font:inherit;font-size:18px;font-weight:800;text-decoration:none;text-align:center;color:var(--ink);background:var(--accent);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:14px 12px;cursor:pointer}
  .boton:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .boton.off{background:#e9e2d4;color:var(--gris);cursor:default;box-shadow:none;transform:none}
  .cuenta{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
  .cuenta div{min-width:58px;border:2px solid var(--ink);border-radius:8px;background:#fff;padding:6px 4px}
  .cuenta b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
  .cuenta span{font-size:11px;color:var(--gris)}
  .nota{font-size:13px;color:var(--gris);margin-top:8px}
  .fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #d9d0c1}
  .fila:first-child{border-top:0}
  .tipo{font-size:15px;font-weight:600}
  .estado{font-size:13px;font-weight:700;border:1.5px solid currentColor;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .disponible{color:var(--green);background:var(--green-l)}
  .ultimas{color:var(--amber);background:var(--amber-l)}
  .espera{color:var(--red);background:var(--red-l)}
  .pie{font-size:12px;color:var(--gris);margin-top:10px}
</style>
</head>
<body>
<div class="caja">
  <div class="acceso" id="acceso"></div>
  <div id="bloque-plazas" style="display:none">
    <h2>Plazas</h2>
    <div id="filas"></div>
    <div class="pie" id="pie"></div>
  </div>
</div>
<script>
// Solo lee /publico: estado de las plazas, hora de apertura y, cuando está abierto, el enlace del formulario.
const URL_PUBLICO = 'https://asturludicas-2016-default-rtdb.europe-west1.firebasedatabase.app/publico.json';
const TIPOS = [['individual','Habitación individual'],['doble','Habitación doble'],['compartida','Habitación triple o cuádruple'],['sin','Sin alojamiento']];
const TXT = {disponible:'Disponible', ultimas:'Últimas plazas', espera:'Lista de espera'};
let datos = null, temporizador = null;

const fechaApertura = ms => new Date(ms).toLocaleString('es-ES', {timeZone:'Europe/Madrid', weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
const dos = n => String(n).padStart(2,'0');

function pintarAcceso(){
  const el = document.getElementById('acceso');
  const pl = (datos && datos.plazas) || {}, fo = (datos && datos.formulario) || {};
  const apertura = pl.apertura ? Date.parse(pl.apertura) : NaN;
  const ahora = Date.now();
  if(fo.abierto && fo.url && (isNaN(apertura) || ahora >= apertura - 60000)){
    el.innerHTML = '<a class="boton" href="'+encodeURI(fo.url)+'" target="_blank" rel="noopener">Inscríbete</a>'
      +'<p class="nota">Rellena un único formulario para todo tu grupo.</p>';
    return;
  }
  if(!isNaN(apertura) && ahora < apertura){
    let s = Math.floor((apertura - ahora)/1000);
    const d = Math.floor(s/86400); s%=86400; const h = Math.floor(s/3600); s%=3600; const m = Math.floor(s/60); s%=60;
    el.innerHTML = '<p style="font-weight:700">Las inscripciones abren el '+fechaApertura(apertura)+'</p>'
      +'<div class="cuenta"><div><b>'+d+'</b><span>días</span></div><div><b>'+dos(h)+'</b><span>horas</span></div><div><b>'+dos(m)+'</b><span>min</span></div><div><b>'+dos(s)+'</b><span>seg</span></div></div>'
      +'<button class="boton off" disabled>Inscríbete</button>';
    return;
  }
  if(!isNaN(apertura) && ahora < apertura + 15*60000){
    el.innerHTML = '<button class="boton off" disabled>Abriendo inscripciones…</button><p class="nota">En unos segundos aparece el botón. No hace falta recargar.</p>';
    return;
  }
  el.innerHTML = isNaN(apertura) ? '' : '<button class="boton off" disabled>Inscripciones cerradas</button>';
}

function pintarPlazas(){
  const pl = (datos && datos.plazas) || {};
  const filas = TIPOS.filter(([k])=>TXT[pl[k]]).map(([k,l])=>
    '<div class="fila"><span class="tipo">'+l+'</span><span class="estado '+pl[k]+'">'+TXT[pl[k]]+'</span></div>').join('');
  document.getElementById('bloque-plazas').style.display = filas ? '' : 'none';
  document.getElementById('filas').innerHTML = filas;
  document.getElementById('pie').textContent = pl.actualizado ? 'Actualizado: '+new Date(pl.actualizado).toLocaleString('es-ES',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) : '';
}

async function cargar(){
  try{
    const r = await fetch(URL_PUBLICO, {cache:'no-store'});
    if(r.ok) datos = await r.json();
  }catch(e){}
  if(!datos){ document.getElementById('acceso').innerHTML = '<p class="nota">No se pudo cargar el estado de las inscripciones.</p>'; }
  else { pintarAcceso(); pintarPlazas(); }
  // Cerca de la hora de apertura se consulta cada 10 s; el resto, cada minuto
  const ap = datos && datos.plazas && datos.plazas.apertura ? Date.parse(datos.plazas.apertura) : NaN;
  const cerca = !isNaN(ap) && Date.now() > ap - 3*60000 && Date.now() < ap + 15*60000 && !(datos.formulario && datos.formulario.abierto);
  clearTimeout(temporizador);
  temporizador = setTimeout(cargar, cerca ? 10000 : 60000);
}
cargar();
setInterval(()=>{ if(datos) pintarAcceso(); }, 1000);
</script>
</body>
</html>
